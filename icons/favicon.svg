<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- v86_64: the ▚ glyph of the machine manager, phosphor green on black -->
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1418"/><stop offset="1" stop-color="#03060a"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bg)" stroke="#1d3a31" stroke-width="2"/>
  <g fill="#39ff88" filter="url(#glow)">
    <rect x="13" y="13" width="18" height="18" rx="2.5"/>
    <rect x="33" y="33" width="18" height="18" rx="2.5"/>
  </g>
</svg>
