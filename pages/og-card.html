<!doctype html>
<!--
    Source of og.jpg, the link preview of the Pages site. Render at 1200x630 with a
    screenshot of a booted machine saved next to it as terminal.png, e.g. with Chrome:
    google-chrome --headless --hide-scrollbars --window-size=1200,630 --screenshot=og.png og-card.html
    magick og.png -strip -sampling-factor 4:4:4 -quality 88 og.jpg
    (baseline JPEG under 300 KB: WhatsApp drops larger previews)
-->
<meta charset="utf-8">
<style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
        position: relative;
        background:
            radial-gradient(ellipse 60% 70% at 78% 45%, rgba(57, 255, 136, 0.16), transparent 70%),
            radial-gradient(ellipse 50% 60% at 0% 100%, rgba(58, 215, 255, 0.12), transparent 70%),
            linear-gradient(rgba(57, 255, 136, 0.045) 1px, transparent 1px) 0 0 / 40px 40px,
            linear-gradient(90deg, rgba(57, 255, 136, 0.045) 1px, transparent 1px) 0 0 / 40px 40px,
            #03060a;
        color: #c6f5dc;
        font-family: "JetBrains Mono", "Fira Code", "DejaVu Sans Mono", monospace;
    }
    body::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 3px);
        pointer-events: none;
    }
    .left {
        position: absolute;
        left: 64px;
        top: 70px;
        width: 470px;
    }
    .brand {
        font-size: 30px;
        font-weight: bold;
        color: #39ff88;
        text-shadow: 0 0 10px rgba(57, 255, 136, 0.7), 0 0 30px rgba(57, 255, 136, 0.3);
        letter-spacing: 0.02em;
    }
    .brand span { color: #5f8a77; font-weight: normal; font-size: 18px; margin-left: 10px; text-shadow: none; }
    h1 {
        margin-top: 38px;
        font-size: 50px;
        line-height: 1.08;
        color: #eafff3;
        letter-spacing: -0.01em;
    }
    h1 em {
        font-style: normal;
        color: #39ff88;
        text-shadow: 0 0 14px rgba(57, 255, 136, 0.65);
    }
    .sub {
        margin-top: 24px;
        font-size: 19px;
        line-height: 1.55;
        color: #8fbfa8;
    }
    .sub b { color: #3ad7ff; font-weight: normal; }
    .chips { margin-top: 30px; display: flex; gap: 10px; }
    .chip {
        --c: #39ff88;
        padding: 6px 12px;
        border: 1px solid var(--c);
        border-radius: 6px;
        color: var(--c);
        font-size: 16px;
        font-weight: bold;
        background: color-mix(in srgb, var(--c) 12%, transparent);
        box-shadow: 0 0 14px color-mix(in srgb, var(--c) 35%, transparent);
    }
    .url {
        position: absolute;
        left: 64px;
        bottom: 46px;
        font-size: 17px;
        color: #5f8a77;
    }
    .url b { color: #39ff88; font-weight: normal; }

    .window {
        position: absolute;
        right: 52px;
        top: 92px;
        width: 590px;
        border: 1px solid #2a5a4a;
        border-radius: 10px;
        background: #070c10;
        overflow: hidden;
        transform: perspective(1400px) rotateY(-9deg) rotateX(3deg);
        box-shadow:
            0 0 0 1px #000,
            0 30px 70px rgba(0, 0, 0, 0.75),
            0 0 60px rgba(57, 255, 136, 0.28),
            0 0 140px rgba(57, 255, 136, 0.12);
    }
    .titlebar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        font-size: 14px;
        background: linear-gradient(#0f1a1f, #0a1115);
        border-bottom: 1px solid #1d3a31;
    }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: #1d3a31; }
    .dot.g { background: #39ff88; box-shadow: 0 0 8px #39ff88; }
    .titlebar .name { margin-left: 8px; color: #39ff88; font-weight: bold; }
    .titlebar .state { color: #5f8a77; }
    .titlebar .mips { margin-left: auto; color: #3ad7ff; }
    .screen {
        position: relative;
        padding: 12px 14px;
        background: #000;
        line-height: 0;
    }
    .screen img { width: 100%; display: block; filter: saturate(1.1) contrast(1.05); }
    .screen::after {
        /* phosphor tint and curvature vignette */
        content: "";
        position: absolute;
        inset: 0;
        background:
            radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%),
            linear-gradient(rgba(57, 255, 136, 0.06), rgba(57, 255, 136, 0.06));
        mix-blend-mode: normal;
    }
    .glint {
        position: absolute;
        inset: 0;
        background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.07) 42%, transparent 52%);
        pointer-events: none;
    }
</style>

<div class="left">
    <div class="brand">&#x259A; v86_64<span>// vm manager</span></div>
    <h1>64-bit Linux,<br><em>in your browser.</em></h1>
    <p class="sub">An <b>x86-64 JIT</b> to WebAssembly. Pick an ISO, hit start: it streams and boots. Nothing to install.</p>
    <div class="chips">
        <span class="chip" style="--c: #2fa6e8">Alpine</span>
        <span class="chip" style="--c: #e8366e">Debian</span>
        <span class="chip" style="--c: #ff6a2b">Ubuntu</span>
        <span class="chip" style="--c: #c6f5dc">your ISO</span>
    </div>
</div>
<div class="url">&#x25B6; <b>portlandhodl.github.io/v86_64</b></div>

<div class="window">
    <div class="titlebar">
        <span class="dot g"></span><span class="dot"></span><span class="dot"></span>
        <span class="name">Alpine Linux 3.19</span><span class="state">[Running]</span>
        <span class="mips">x86_64 &middot; long mode</span>
    </div>
    <div class="screen">
        <img src="terminal.png" alt="">
        <div class="glint"></div>
    </div>
</div>
