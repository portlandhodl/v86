# Optional: publishes the machine manager to GitHub Pages (see pages/README.md).
# Enable it under Settings -> Pages -> Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.17.0'

      - name: Setup toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Build
        run: make all build/v86-fallback.wasm

      # bsdtar extracts Alpine's kernel and initramfs for examples/bitcoin-wallet-check.html
      - name: Install bsdtar
        run: sudo apt-get install -y libarchive-tools

      - name: Assemble site
        run: node pages/build.mjs --out _site
        env:
          # repository variables override pages/site.json
          V86_CATALOGUE_URL: ${{ vars.V86_CATALOGUE_URL }}
          V86_SITE_URL: ${{ vars.V86_SITE_URL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
